name: Daily NOTAM to KML

on:
  schedule:
    # Runs every day at 06:00 UTC (08:00 SAST)
    - cron: '0 6 * * *'
  workflow_dispatch:   # Allows you to run it manually

permissions:
  contents: write   # needed to commit the refreshed docs/ data for GitHub Pages

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -c "import pypdf, simplekml; print('pypdf', pypdf.__version__); print('simplekml', simplekml.__version__)"

      - name: Run the script
        run: |
          python notam_to_kml.py

      - name: Upload KML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notams-kml
          path: notams.kml
          retention-days: 7

      - name: Update web map data
        run: |
          cp airports.csv docs/airports.csv

      - name: Commit and push web map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/notams.geojson docs/airports.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NOTAM web map data"
            git push
          fi
